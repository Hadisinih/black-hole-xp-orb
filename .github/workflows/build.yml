name: Build Black Hole XP Orb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: unzip -o BlackHoleXPOrb_1.21.11_Fabric_Renderer_v2.zip -d extracted

      - name: Build mod
        run: |
          cd extracted/blackhole-xp-orb
          gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: BlackHoleXPOrb-Mod
          path: extracted/blackhole-xp-orb/build/libs/*.jar
